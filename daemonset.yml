apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: my-ds
  labels:
    app: ds
spec:
  selector:
    matchLabels:
      app: ds
  template:
    metadata:
      labels:
        app: ds
    spec:
      containers:
        - name: ds-cont
          image: amazon/cloudwatch-agent 
          ports:
            - name: nginx-port
              containerPort: 80
