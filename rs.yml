apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: my-rs
  labels:
    app: rs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rs
  template:
    metadata:
      labels:
        app: rs
    spec: 
      containers:
        - image: nginx:latest
          name: rs-cont
          ports:
            - name: nginx-port
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: rs-svc
  labels:
    app: rs
spec:
  type: NodePort
  selector:
    app: rs
  ports:
    - port: 80
      targetPort: 80
