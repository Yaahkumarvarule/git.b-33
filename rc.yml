apiVersion: v1
kind: ReplicationController
metadata:
  name: my-rc
  labels:
    app: rc
spec:
  replicas: 2
  selector:
    app: rc
  template:
    metadata:
      labels:
        app: rc-template
        labels:
          app: rc
  spec:
    containers:
      - image: nignx:latest
        name: rc-cont
        ports:
         - name: nginx-port
           containerPort: 80
---
spec:
apiVersion: v1
kind: Service
metadata:
  name: rc-svc4
  labels:
    app: rc
spec:
  type: NodePort
  selector:
    app: rc
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
