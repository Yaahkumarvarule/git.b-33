apiVersion: v1
kind: Pod
metadata:
  name: my-pod
  labels:
    app: my-app
spec:
  tolerations:
    - key: "prod"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  containers:
    - image: nginx:latest
      name: my-container
      ports:
        containerPort: 80
  nodeSelector:
    type: node01