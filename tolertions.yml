apiVersion: v1
kind: Pod
metadata:
  name: mypod
  labels:
    app: myapp
spec:
  tolerations:
    - key: "prod"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  nodeSelector:
    type: frontend
  containers:
    - image: nginx:latest
      name: my-container
      ports:
        - containerPort: 80
  